
spring:
  datasource:
    url: jdbc:sqlite:gaia_workflow.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  sql:
    init:
      schema-locations: classpath:sql/schema.sql
      mode: always
  application:
    name: gaia-workflow-app

server:
  port: 48080

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

agent:
  llm:
    api-host: http://localhost:1234/v1
    api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    model: qwen/qwen3-4b-2507
    temperature: 0.5
  history:
    max-messages: 20
  # 火山方舟 Managed Agents（engine=ark 的 Agent 使用；DB provider_config:ark 可在线覆盖）
  ark:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ""
    environment-id: ""
    default-agent-id: ""
    default-model-id: ""
    connect-timeout-ms: 10000
    read-timeout-ms: 300000
