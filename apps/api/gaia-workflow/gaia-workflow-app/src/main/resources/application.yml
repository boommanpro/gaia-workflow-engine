
spring:
  datasource:
    url: jdbc:sqlite:gaia_workflow.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  sql:
    init:
      schema-locations: classpath:sql/schema.sql
      mode: always
  application:
    name: gaia-workflow-app

server:
  port: 48080

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

agent:
  llm:
    # 平台默认模型（会话 Agent 与 llm 节点凭据兜底）：火山方舟 Coding Plan（字节 coding plan，
    # 套餐内 deepseek-v4-pro）。三个口径差异（2026-11-05 实测）：
    #   ① coding plan 模型只能走 /api/coding/v3 专用端点，标准 /api/v3 报 InvalidEndpointOrModel.NotFound；
    #   ② 规格来自 ListArkCodingPlanModel：ContextWindow 1M / MaxInput 393k / MaxCompletion 393k；
    #   ③ 思考型模型（默认输出 reasoning_content），thinking 档位参数兼容（thinking_budget 可下发）。
    # 凭据只从环境变量 GAIA_LLM_API_KEY 注入，默认空（凭证不入库）；模型管理页全局默认（DB model.active → llm_model 条目）在线覆盖此兜底
    api-host: https://ark.cn-beijing.volces.com/api/coding/v3
    api-key: ${GAIA_LLM_API_KEY:}
    model: deepseek-v4-pro
    temperature: 0.5
    # 思考型模型：reasoning 计入 completion（max_tokens 需容纳 thinking=high 预算 24576 + 正文余量）
    max-tokens: 32768
    # 平台默认上下文窗口（token）：条目级模型可在模型管理页单独配 context_window 覆盖；
    # 历史压缩线 = 窗口 × 阈值%（阈值全局可配：DB model.compaction → run.compaction-threshold-percent）
    context-window: 1048576
    # 模型调用重试（单一指数退避曲线，不区分错误类型）：免费活动模型 429 全局限流
    # （free_campaign_global_limit，限流窗与所有活动用户共享）只能拉长曲线硬扛——
    # 旧硬编码 5 次/500ms/10s 总窗口仅约 8 秒，实测两轮 Retries exhausted 4/4（会话 96ba4201）；
    # 默认 8 次、1s→45s，累计退避约 2 分钟。换付费模型后可调回更紧凑的值
    retry:
      max-attempts: 8            # 总尝试次数（含首次，框架日志显示为 attempt N/7）
      initial-backoff-ms: 1000   # 首次退避，之后按倍率指数递增
      max-backoff-ms: 45000      # 单次退避上限
      backoff-multiplier: 2.0    # 退避倍率
      timeout-ms: 300000         # 单次模型调用超时（5 分钟）
  # 跨 run 历史压缩触发线（相对窗口的百分比，10-95）：模型管理页全局设置在线覆盖（DB model.compaction）
  run:
    compaction-threshold-percent: 80
  # ask_user 提问的挂起等待上限（秒）：全局默认，模型可用工具参数 timeoutSeconds（5-300）按次覆盖；
  # 超时自动替用户选择 recommended 选项（无则第一个），答案作为新一轮对话继续。
  # max-auto-answers：同一会话连续自动代答的上限（防「追问→超时→自答→再追问」自驱循环），
  # 达到上限后按「未回应」收尾，用户真实作答即重置
  ask-user:
    timeout-seconds: 60
    max-auto-answers: 2
  # 火山方舟 Managed Agents（engine=ark 的 Agent 使用；DB provider_config:ark 可在线覆盖）
  ark:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ""
    environment-id: ""
    default-agent-id: ""
    default-model-id: ""
    connect-timeout-ms: 10000
    read-timeout-ms: 300000
  # AgentScope Service 自托管（engine=as-service 的 Agent 使用；DB provider_config:as-service 可在线覆盖）
  as-service:
    base-url: http://localhost:18080
    api-key: ""            # 数据面 Application API Key（X-API-Key）
    admin-username: admin  # 管理面账号（按会话自动同步托管 Agent）
    admin-password: ""
    tenant: default
    namespace: default
    mcp-public-url: http://host.docker.internal:48080  # 数据面回连 Gaia MCP 的基址
    model: dashscope:qwen-max
    connect-timeout-ms: 10000
    read-timeout-ms: 60000

# 工作流数据面
workflow:
  execute:
    # 执行前预检：生效版本先过 WorkflowDslValidator，error 级问题直接拒绝执行（false 可临时关闭）
    pre-validate: true
