
spring:
  datasource:
    url: jdbc:sqlite:gaia_workflow.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  sql:
    init:
      schema-locations: classpath:sql/schema.sql
      mode: always
  application:
    name: gaia-workflow-app

server:
  port: 48080

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

agent:
  llm:
    # 平台默认模型（会话 Agent 与 llm 节点凭据兜底）：dmxapi 免费 glm-4-flash。
    # 凭证不入库（首次部署二选一，改完即生效）：
    #   ① 环境变量 GAIA_LLM_API_KEY（启动前设置，会随 seedModelConfig 灌入数据库）；
    #   ② 部署后登录管理后台 manage/agent-config → llm_config 在线填写（推荐，即时生效）。
    # 不设置则 llm 凭证为空：llm 节点/对话引擎在首次调用时报「缺少 apiKey 配置」并带修复指引。
    api-host: https://www.dmxapi.cn/v1
    api-key: ${GAIA_LLM_API_KEY:}
    model: glm-4-flash
    temperature: 0.5
    # 平台默认上下文窗口（token）：条目级模型可在模型管理页单独配 context_window 覆盖；
    # 历史压缩线 = 窗口 × 阈值%（阈值全局可配：DB model.compaction → run.compaction-threshold-percent）
    context-window: 32768
  # 跨 run 历史压缩触发线（相对窗口的百分比，10-95）：模型管理页全局设置在线覆盖（DB model.compaction）
  run:
    compaction-threshold-percent: 80
  # ask_user 提问的挂起等待上限（秒）：全局默认，模型可用工具参数 timeoutSeconds（5-300）按次覆盖；
  # 超时自动替用户选择 recommended 选项（无则第一个），答案作为新一轮对话继续。
  # max-auto-answers：同一会话连续自动代答的上限（防「追问→超时→自答→再追问」自驱循环），
  # 达到上限后按「未回应」收尾，用户真实作答即重置
  ask-user:
    timeout-seconds: 60
    max-auto-answers: 2
  # 火山方舟 Managed Agents（engine=ark 的 Agent 使用；DB provider_config:ark 可在线覆盖）
  ark:
    base-url: https://ark.cn-beijing.volces.com/api/v3
    api-key: ""
    environment-id: ""
    default-agent-id: ""
    default-model-id: ""
    connect-timeout-ms: 10000
    read-timeout-ms: 300000
  # AgentScope Service 自托管（engine=as-service 的 Agent 使用；DB provider_config:as-service 可在线覆盖）
  as-service:
    base-url: http://localhost:18080
    api-key: ""            # 数据面 Application API Key（X-API-Key）
    admin-username: admin  # 管理面账号（按会话自动同步托管 Agent）
    admin-password: ""
    tenant: default
    namespace: default
    mcp-public-url: http://host.docker.internal:48080  # 数据面回连 Gaia MCP 的基址
    model: dashscope:qwen-max
    connect-timeout-ms: 10000
    read-timeout-ms: 60000

# 工作流数据面
workflow:
  execute:
    # 执行前预检：生效版本先过 WorkflowDslValidator，error 级问题直接拒绝执行（false 可临时关闭）
    pre-validate: true
