<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Gaia macOS 应用图标：Apple 图形网格（1024 画布 / 824 主体 / rx186），
       纵向渐变 + 顶部微光营造立体感，白色粗体 G 用系统字体直接排版
       （Electron 离屏渲染时可访问 SF Pro；线段节点风格的旧 G 在小尺寸下过于琐碎）。
       生成方式：scripts/make-icon.sh。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" ry="186" fill="url(#bg)"/>
  <!-- 顶部光泽：只覆盖上缘圆角内的浅色带 -->
  <path d="M 100 286
           A 186 186 0 0 1 286 100
           L 738 100
           A 186 186 0 0 1 924 286
           L 924 420
           L 100 420 Z"
        fill="url(#topLight)"/>

  <!-- 字母 G：SF Pro 粗体（构建时系统字体渲染），光学居中微调 -->
  <text x="516" y="510"
        font-family="-apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif"
        font-size="580" font-weight="700"
        text-anchor="middle" dominant-baseline="central"
        fill="#ffffff">G</text>
</svg>
