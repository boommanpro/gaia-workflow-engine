<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Gaia</title>
  <style>
    /* 启动等待页：后端健康检查通过前展示（Spring Boot 冷启动约 10~20 秒） */
    html, body {
      height: 100%;
      margin: 0;
      background: #0f1117;
      color: #c9cdd4;
      font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }
    .ring {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(99, 102, 241, 0.25);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 17px; letter-spacing: 0.5px; }
    .hint { font-size: 13px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="ring"></div>
    <div class="title">正在启动 Gaia 服务…</div>
    <div class="hint">首次启动需要初始化数据库，可能需要十几秒</div>
  </div>
</body>
</html>
