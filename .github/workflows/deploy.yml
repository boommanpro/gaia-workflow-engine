name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pnpm 版本从 apps/console/package.json 的 packageManager 字段读取
      # （action 默认只读仓库根 package.json，需显式指定 package_json_file）
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/console/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: apps/console/pnpm-lock.yaml

      # 构建新的单体 React 前端应用（Gaia）
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/console

      - name: Build for GitHub Pages
        run: pnpm build:gh-pages
        working-directory: apps/console

      # 部署到 gh-pages 分支（仓库 Pages 已配置为从此分支部署）
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: apps/console/dist
          clean: true
          clean-exclude: |
            .git
