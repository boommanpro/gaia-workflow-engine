name: Verify (tests)

# 2026-10-16 起：PR 与 main 推送必跑后端 mvn test + 前端 vitest。
# 此前 deploy.yml 不跑任何测试，回归全靠人肉——这里是合入前的 P0 卡口。
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21：Java 代码节点运行时编译硬编码 -source 21（JavaCompilerEngine），
          # 17 下所有 java 执行类测试报 invalid source release
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B test
        working-directory: apps/api/gaia-workflow

  frontend:
    name: Frontend (lint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本从 apps/console/package.json 的 packageManager 字段读取
      # （action 默认只读仓库根 package.json，需显式指定 package_json_file）
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/console/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: apps/console/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/console

      # eslint 默认只在 error 时非零退出；积压的 prettier/import-order 告警不阻塞，清零后再加 --max-warnings=0
      - name: Lint
        run: pnpm lint
        working-directory: apps/console

      - name: Run tests
        run: pnpm test
        working-directory: apps/console

      # 类型检查基线已清零（2026-11-08），此后 ts-check 失败即卡合并
      - name: Type check
        run: pnpm ts-check
        working-directory: apps/console
